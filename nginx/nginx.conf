# The nginx configuration for the uva-web image.
#
# Deliberately small: the image runs as a non-root user with a
# read-only root filesystem, so every path nginx writes to lives
# under /tmp — the pid file, the temporary paths and the rendered
# site configuration alike. The site configuration itself is
# `default.conf.template` beside this file; the image's entrypoint
# renders it into the directory included at the bottom of this file.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # Every writable path is under /tmp: the root filesystem is
    # read-only in the deployment.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # The rendered site configuration (the entrypoint writes it here).
    include /tmp/nginx/conf/*.conf;
}
