[workspace]
members = [
    "crates/uva",
    "crates/uva-core",
    "crates/uva-kernel",
    "crates/uva-telemetry",
    "crates/uva-provider",
    "crates/uva-context",
    "crates/uva-tool",
    "crates/uva-tool-plugins",
    "crates/uva-policy-plugins",
    "crates/uva-skill",
    "crates/uva-session",
    "crates/uva-steering",
    "crates/uva-harness",
    "crates/uva-core-tokio",
    "crates/uva-app-server",
    "crates/uva-test-support",
    "crates/uva-mcp",
    "crates/uva-mcp-server",
    "crates/uva-search",
    "crates/uva-scheduler",
    "crates/uva-eval",
    "crates/uva-runtime",
    "crates/uva-tui",
    "crates/uva-gateway",
]
resolver = "2"

[workspace.dependencies]
blake3 = "1.5"
# The facade crate: one dependency, one prelude. It re-exports the
# pieces below and is never depended on by them (one-way, no cycle).
uva = { path = "crates/uva", version = "0.1" }
uva-core = { path = "crates/uva-core", version = "0.1" }
uva-kernel = { path = "crates/uva-kernel", version = "0.1" }
uva-telemetry = { path = "crates/uva-telemetry", version = "0.1", default-features = false }
uva-provider = { path = "crates/uva-provider", version = "0.1", default-features = false }
uva-context = { path = "crates/uva-context", version = "0.1" }
uva-tool = { path = "crates/uva-tool", version = "0.1", default-features = false }
uva-tool-plugins = { path = "crates/uva-tool-plugins", version = "0.1", default-features = false }
uva-policy-plugins = { path = "crates/uva-policy-plugins", version = "0.1", default-features = false }
uva-skill = { path = "crates/uva-skill", version = "0.1" }
 uva-steering = { path = "crates/uva-steering", version = "0.1" }
uva-session = { path = "crates/uva-session", version = "0.1" }
uva-harness = { path = "crates/uva-harness", version = "0.1" }
uva-core-tokio = { path = "crates/uva-core-tokio", version = "0.1" }
uva-app-server = { path = "crates/uva-app-server", version = "0.1" }
uva-attachment = { path = "crates/uva-attachment", version = "0.1" }
uva-mcp = { path = "crates/uva-mcp", version = "0.1" }
uva-mcp-server = { path = "crates/uva-mcp-server", version = "0.1" }
uva-scheduler = { path = "crates/uva-scheduler", version = "0.1" }
uva-search = { path = "crates/uva-search", version = "0.1" }
uva-test-support = { path = "crates/uva-test-support", version = "0.1" }
uva-eval = { path = "crates/uva-eval", version = "0.1" }
uva-runtime = { path = "crates/uva-runtime", version = "0.1" }
# The terminal projection: a ratatui/crossterm front-end that drives the
# `serve` gateway through the shared gateway crate (the same `/rpc`
# WebSocket the browser speaks). It is an application crate, so it
# stays `publish = false`.
uva-tui = { path = "crates/uva-tui", version = "0.1" }
# Shared gateway support for the hosts: the `serve` process supervisor
# and its WebSocket JSON-RPC client. `publish = false` — it consumes
# the app server's CLI contract.
uva-gateway = { path = "crates/uva-gateway", version = "0.1" }
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"

 # Async runtime
#
# No `full`: every crate declares the features it actually uses, so the
# feature set a consumer ends up compiling is the union of what the
# pieces they enabled need — a crate that only awaits channels does not
# pull the process, fs, signal, and net subsystems. `cargo check -p
# <crate>` is the authority; each crate's `tokio` line carries a short
# comment saying why its features are what they are.
tokio = { version = "1.53", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
# The gateway WebSocket client's transport: the `handshake` feature
# only (dialed with `client_async` over a plain TcpStream), so no TLS
# stack is pulled into the default build.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# The plugin kernel's framework. The package is `cordis-rs`; the lib
# target is `cordis`, which is why the rename is mandatory — a bare
# `cordis = "0.6"` does not resolve to this package. Pinned to 0.6
# (pre-1.0): do not cross a minor without re-reading `spike-notes.md`.
cordis = { package = "cordis-rs", version = "0.6" }

# The `async_stream!` macro: the test fixtures build scripted
# event streams with it. No production path uses it.
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
schemars = { version = "1.2", features = ["derive", "preserve_order"] }
schemars_derive = "1.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"
validator = { version = "0.21", features = ["derive"] }

# Utilities
ulid = { version = "3.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Cron parsing is opt-in: only `uva-scheduler`'s `cron` feature
# pulls this in, and it does so behind `dep:cron`, so no default build
# grows a parser dependency.
cron = "0.17"
uuid = { version = "1.24", features = ["v4", "serde"] }
indexmap = "2.14"
parking_lot = "0.12"
rand = "0.8"
# `bundled` compiles SQLite from the amalgamation (FTS5 enabled) so the
# build needs no system libsqlite3; only the optional `uva-context`
# `sqlite` feature pulls this in.
rusqlite = { version = "0.40", features = ["bundled"] }

# HTTP server
axum = { version = "0.8", features = ["ws"] }
# Optional cluster bus backend (`uva-app-server` feature
# `cluster-redis`): pub/sub + `SET NX EX` leases. Only the
# tokio async command surface is needed (multiplexed connections),
# so the client's extra capabilities stay off.
tower-http = { version = "0.7", features = ["fs"] }
http = "1.5"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }

# Tracing pillars, feature sets centralized here so every crate opts in to
# exactly what the code uses (default-features = false on the OTel /
# tracing-subscriber families). The three telemetry pillars:
#   - logging  → tracing + tracing-subscriber (fmt / ansi console + env-filter)
#   - traces   → opentelemetry OTLP (tonic gRPC + reqwest HTTP transports,
#                TLS for `https://` gRPC endpoints; metrics/logs signals off)
#   - metrics  → prometheus (text exposition only; protobuf / push off)
# Crate-level feature gates (`otel`, `metrics`) live in
# `crates/uva-telemetry/Cargo.toml` and re-export through downstream
# crates that opt into observability.
tracing = { version = "0.1", default-features = false, features = [
  "std",
  "attributes",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "ansi",
  "env-filter",
] }
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "rt-tokio",
  "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-semantic-conventions = { version = "0.32", features = [
  "semconv_experimental",
] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "grpc-tonic",
  "http-proto",
  "reqwest-client",
  "tls-ring",
  "tls-webpki-roots",
] }
tracing-opentelemetry = { version = "0.33", default-features = false }
url = "2.5"
prometheus = { version = "0.14", default-features = false }
lazy_static = "1.5"

# Encoding
base64 = "0.22"

# Additional utilities
dashmap = "6.2"
regex = "1.13"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tempfile = "3.8"
wiremock = "0.6"
dotenvy = "0.15"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Terminal UI (`uva-tui` only). `ratatui`'s default backend is the
# crossterm one, so the explicit feature keeps the dependency honest
# without pulling a second terminal backend. Both crates are MIT; the
# `event-stream` feature (a futures `Stream` of terminal events) is
# enabled at the `uva-tui` line, not here, because no other crate
# reads terminal events.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

# Static assets baked into the binary (the `embed-web` feature of
# `uva-app-server`).
rust-embed = "8.7"

# YAML parsing
serde_yaml = "0.9"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/crochee/uva"
homepage = "https://github.com/crochee/uva"
documentation = "https://docs.rs/uva"
readme = "README.md"
keywords = ["ai", "agent", "llm", "plugin", "orchestration"]
categories = ["asynchronous", "development-tools"]

# --- Release profile ---
#
# Optimised for low-latency request handling on a single
# long-lived server process. Compared to Cargo's defaults we:
#   - drop `debug` symbols (`0` ⇒ fastest link, smallest binary).
#     Profile-guided optimisation requires symbols so we keep
#     `1` if/when PGO is wired in; until then `0` wins on
#     cold-start time and RSS, which is the metric that matters
#     for a chat server that streams many small responses.
#   - enable thin LTO (`"thin"`) — full LTO gives ~5% throughput
#     on hot paths but blows the build time from minutes to hours;
#     thin LTO is the sweet spot for a server binary that still
#     builds in seconds.
#   - set `codegen-units = 1` so the compiler can inline across
#     crate boundaries (the LTO step). The default of 16 enables
#     faster parallel compilation but leaves ~10% of optimisations
#     on the table.
#   - bump `opt-level = 3` (Cargo's default) to keep the
#     tightest scalar / loop optimisations on.
#
# `panic = "abort"` is intentionally left at the default
# ("unwind") — turning it to abort would shrink the binary by a
# few hundred KB at the cost of an opaque crash dump, and the
# server-side middleware already converts panics to JSON 500s
# before they ever reach the unwinder (see
# `middleware/error_handler.rs`).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"

# ───────────────────────────────────────────────────────────────────────
# Workspace lints — applied to every member of this workspace unless the
# member opts out with its own `[lints]` table.
#
# Why here, not in clippy.toml: clippy.toml only governs the *clippy* lints
# (the cognitive-complexity threshold, the disallowed-methods list, etc.).
# Rustdoc lints (`missing_docs`, `broken_intra_doc_links`, `private_doc_tests`,
# etc.) and Rust lints (`unused`, `dead_code`, ...) live in Cargo.toml's
# `[workspace.lints]` since Cargo 1.74.
#
# Levels chosen for a 4w+ star-grade library workspace:
#   - `missing_docs = "warn"` (not "deny"): we have many public surface
#     items that predate this convention. A warn lets `make doc-check`
#     surface them, and reviewers add a doc comment when touching the
#     function. Promoting to "deny" is a one-line change once the surface
#     stabilises.
#   - `rustdoc::broken_intra_doc_links = "warn"` — `-D warnings` in
#     RUSTDOCFLAGS (see `.github/workflows/docs.yml` and `make doc-check`)
#     already turns this into a failure, so an explicit warn keeps the
#     intent local to the file that configures it.
#   - `rustdoc::private_doc_tests = "warn"` — see the Rust API Guidelines:
#     any `#[cfg(test)]` doctest must be reachable through the public
#     surface or it is dead. Surfacing warns, not denying, lets the test
#     owner move or remove the test.
# ───────────────────────────────────────────────────────────────────────
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_doc_tests = "warn"
missing_crate_level_docs = "warn"

# ───────────────────────────────────────────────────────────────────────
# docs.rs metadata — drives how `docs.rs/<crate>` renders this workspace.
#
# Without this block, docs.rs falls back to "default features only", so
# every opt-in feature surface (`cron` / `mcp` / `search` / `eval` /
# `scheduler` / `telemetry` / `sqlite` / `attachment` /
# `skill` / `tool-scheduler` / `tool-search` …) renders as an empty
# module. That hides the opt-in contract from anyone reading the
# rendered docs — exactly the audience the facade is for.
#
# `all-features = true` is the simplest way to render every surface;
# the dependency cost is bounded because `check-mvp-deps` already
# proves the 7-feature MVP subset pulls zero HTTP/OTel/DB stack.
# `no-default-features = true` is NOT set, because the default set is
# the "assemble a basic agent" set — the entry-level reader must see
# it first.
# ───────────────────────────────────────────────────────────────────────
[workspace.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rand = "0.8"
