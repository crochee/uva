# k8s deployment manifest — uva-web
#
# The React/Vite frontend serves the static SPA bundle via nginx.
# The nginx config (`nginx/default.conf.template`) reverse-proxies
# the server's HTTP surface — `/rpc` (the JSON-RPC websocket),
# `/livez`, `/readyz`, `/version` and `/metrics` — to the
# uva-server Service, so the SPA and the API share one origin in
# production (avoids CORS, keeps cookies first-party).
#
# Design points:
#   1. Deployment, 1 replica minimum; HPA is downstream.
#   2. SecurityContext: non-root (65532), read-only root filesystem,
#      only port 8080 open. The port is above 1024, so the container
#      needs no capability and no privileged port.
#   3. Service: ClusterIP; an Ingress (out of scope for this
#      reference manifest) terminates TLS in front of it.
#   4. Probes: HTTP `/` against the served index.html — the
#      nginx config returns 200 on every request, so the probe is a
#      pure liveness signal.
#   5. PDB: at least one replica remains during voluntary
#      disruptions.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: uva-web
  labels:
    app.kubernetes.io/name: uva-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: uva
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uva-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uva-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: uva
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/crochee/uva-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            # The address the server is reachable at: the API surface
            # (`/rpc`, `/livez`, `/readyz`, `/version`, `/metrics`) is
            # proxied to it, so the SPA and the API share one origin.
            - name: UVA_UPSTREAM
              value: "http://uva-server:8080"
            # The port nginx listens on. Above 1024, so the container
            # needs no capability and no privileged port.
            - name: UVA_PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx writes its pid file, its temporary paths and the
            # rendered site configuration under /tmp; the root
            # filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: uva-web
  labels:
    app.kubernetes.io/name: uva-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: uva-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: uva-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uva-web