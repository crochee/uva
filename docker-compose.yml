# Docker Compose for elysper development.
#
# Spins up:
#   - server: elysper-server (Rust) on :8080
#   - web: elysper-web (React/Vite dev server with HMR) on :5173
#
# The web service proxies /api, /v1 and /readyz + /livez to the
# server (see elysper-web/vite.config.ts), so the browser can
# call the backend on the same origin.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: elysper-server:dev
    container_name: elysper-server-dev
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - ELYSPER_HOST=0.0.0.0
      - ELYSPER_PORT=8080
    volumes:
      # Mount source for live cargo rebuild
      - ./crates:/app/crates:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: builder
    image: elysper-web:dev
    container_name: elysper-web-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:8080
      - VITE_CHAT_URL=/api/v1/chat
    volumes:
      - ./elysper-web:/app:ro
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      server:
        condition: service_healthy
