# Docker Compose for elysper development.
#
# Spins up:
#   - app-server: elysper-app-server (Rust) in `serve` mode on :8080
#
# The gateway spawns one headless core subprocess and serves it over
# a WebSocket at `/rpc`; the web front-end talks to that socket. The
# probes (`/livez`, `/readyz`) live on the same port.

services:
  app-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: elysper-app-server:dev
    container_name: elysper-app-server-dev
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - ELYSPER_HOST=0.0.0.0
      - ELYSPER_PORT=8080
    volumes:
      # Mount source for live cargo rebuild
      - ./crates:/app/crates:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
