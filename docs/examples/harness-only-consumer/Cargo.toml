[package]
name = "elysper-harness-only-consumer"
version = "0.1.0"
edition = "2021"
publish = false

# Same posture as `../minimal-consumer`: the empty `[workspace]` table
# keeps this crate OUT of the elysper workspace, so it compiles as an
# independent consumer would and its dependency tree is its own.
[workspace]

# The proof: this crate depends on the harness and the *seams* the
# harness's signatures name — no runtime crate. There is deliberately
# no `tokio` line here, and the verification is that no `tokio` appears
# in `cargo tree` either (see `docs/examples/README.md`). If the
# harness closure ever grows one, this fixture is the tripwire: do not
# add tokio to make it build.
#
# A harness-only consumer writes four crates, because the harness
# re-exports none of the traits it hands back:
#
#   elysper-harness  — the loop, the seams, the event stream
#   elysper-core     — CancelToken / Spawner / Clock
#   elysper-provider — the ModelProvider trait and the message types
#   elysper-tool     — the Tool trait and ToolRegistry
#
# `async-trait` expands the attribute those traits are declared with;
# it is a proc-macro crate, not a runtime. `futures` drives the event
# stream (`StreamExt`) and `serde_json` types the tool arguments, so
# the seven lines below are this crate's direct dependencies — the
# count the harness README and the tutorial quote.
#
# The provider line carries `default-features = false`, and that flag
# is the whole reason this tree is runtime-free: `elysper-provider`'s
# default feature set (`default = ["anthropic", "openai"]`) turns on
# the two shipped HTTP adapters, each of which carries `reqwest`,
# `tokio` and `tokio-util`. A consumer who writes the plain
# `elysper-provider = "0.1"` gets all three. (`elysper-tool` has no
# feature set at all, so the flag on it below is a no-op.)
[dependencies]
elysper-harness = { path = "../../../crates/elysper-harness" }
elysper-core = { path = "../../../crates/elysper-core" }
elysper-provider = { path = "../../../crates/elysper-provider", default-features = false }
elysper-tool = { path = "../../../crates/elysper-tool", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
