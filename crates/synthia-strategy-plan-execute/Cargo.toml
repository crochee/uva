[package]
name = "synthia-strategy-plan-execute"
description = "Plan-and-Execute reasoning strategy: decompose the prompt into numbered steps, run each step through the model's tool loop, re-plan between iterations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
synthia-core.workspace = true
synthia-harness.workspace = true
synthia-context.workspace = true
synthia-provider = { workspace = true, default-features = false }
synthia-tool.workspace = true
synthia-steering.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
# Reserved name: the harness has no `safety` feature (its scan
# points are always-on, wired by the consumer); the flag is kept
# so downstream feature graphs that mention it still resolve.
safety = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
chrono.workspace = true
synthia-context.workspace = true