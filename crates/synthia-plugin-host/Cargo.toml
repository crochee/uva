[package]
name = "synthia-plugin-host"
description = "Host half of Synthia's dynamic plugin channel: process management, a JSON-RPC client, and Host registrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The host half of the dynamic plugin channel, and no runtime.
#
# The plugin is a `std::process::Command` and its blocking protocol IO
# runs through `synthia_core::blocking::Blocking` — `synthia-core` is
# here for that seam alone, not for a sleeper.
# The deadline is a condition variable in the connection's own reaper
# thread (`src/client.rs`): a `Sleeper` wait cannot be cancelled, so a
# reaper built on one would either spawn a sleeper thread per request
# or delay shutdown by a whole timeout. That is also why this crate
# cannot reuse `synthia-mcp`'s transport stack (tokio + reqwest) and
# owns the process itself instead. `cargo tree -p synthia-plugin-host
# -e normal | grep -c tokio` must print 0.
[dependencies]
synthia-plugin-protocol.workspace = true
synthia-harness.workspace = true
synthia-tool.workspace = true
synthia-core.workspace = true
synthia-steering.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The observer test points a plugin's event log at a temporary file.
tempfile.workspace = true
# The tool test reads the content parts out of a `ToolOutput`; those
# parts are the provider's vocabulary, not this crate's.
synthia-provider.workspace = true
# The audit test runs one real agent loop over a remote plugin: the
# rewrite of its tool result has to leave a row in the session log.
synthia-session.workspace = true
