[package]
name = "uva-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Evaluation framework for uva agents: suites, metrics, runner, export"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
uva-core = { workspace = true }
uva-kernel.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# `EvalSuite` / `TestCase` / `TestResult` / `EvalReport` derive
# `JsonSchema` so the app-server can emit the frontend's wire
# contract from them.
schemars.workspace = true
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = { workspace = true }
