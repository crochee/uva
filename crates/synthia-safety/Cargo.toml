[package]
name = "synthia-safety"
description = "Defense-in-depth safety scanner plug-in for synthia agents: stage-scoped, regex-based injection/jailbreak/PI-exfil detection. Composable async SafetyScanner trait + RegexInjectionScanner (25 patterns from OWASP AAI2 / CSA MCP) + CompositeScanner dispatcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The crate is the entire plug-in — no `[features]` needed; the facade
# carries the feature that pulls the whole crate in (or not).

[dependencies]
synthia-core.workspace = true
synthia-steering.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
# Examples and tests use `#[tokio::main]`; the lib itself is tokio-free
# (no `tokio` in `[dependencies]`). Asserted by `make check-mvp-deps`.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
synthia.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
