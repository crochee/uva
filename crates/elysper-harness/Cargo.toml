[package]
name = "elysper-harness"
description = "The runtime-neutral agent loop for elysper: ReActAgent, the Host interception registry, the DelegatingTool seam and the event stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
[dependencies]
async-trait.workspace = true
# No runtime bridge in the default build: the loop's public API only
# names `dyn CancelToken` / `Spawner`. Tests (and only tests) drive a
# `tokio_util::CancellationToken` through the trait, so that feature is
# declared in `[dev-dependencies]`.
elysper-core.workspace = true
# The `agentLoop` plugin implements the kernel's `Plugin` contract. The
# kernel in turn depends only on the dependency-free `cordis` crate, so
# this does not pull a runtime into the harness.
elysper-kernel.workspace = true
elysper-provider.workspace = true
elysper-context.workspace = true
elysper-steering.workspace = true
elysper-session.workspace = true
elysper-tool.workspace = true
# The loop names `SpanKind` in its tracing spans.
elysper-telemetry = { workspace = true, default-features = false }

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The approval request carries a digest of the call's arguments, so a
# decision can be checked against the call it was made for.
sha2.workspace = true
hex.workspace = true
# The harness is runtime-neutral: its `[dependencies]` carries zero
# tokio. A consumer on a tokio runtime depends on the sibling
# `elysper-harness-tokio` crate, which provides `TokioSpawner` —
# the adapter that bridges `Spawner` onto `tokio::spawn`. Consumers
# on `smol` / `async-std` / a bare `futures` executor install their
# own adapter and never enter that crate.
tracing.workspace = true
futures.workspace = true
parking_lot.workspace = true

[dev-dependencies]
# Examples use `#[tokio::main]` (multi-thread flavor by default);
# tests also use `tokio::sync::Mutex` and `tokio::time::sleep`.
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
# Tests drive `CancellationToken` through the `CancelToken` trait.
elysper-core = { workspace = true, features = ["tokio-util"] }
# The benchmarks drive a turn on a pooled non-tokio executor, so the
# end-to-end number does not pay for a thread spawn per run.
futures = { workspace = true, features = ["thread-pool"] }
# Tests drive `CancellationToken` through the `CancelToken` trait.
tokio-util.workspace = true
elysper-test-support.workspace = true
tracing-subscriber.workspace = true
# The assembly examples compose the plugin crates exactly as a
# downstream consumer would.
elysper-tool-read.workspace = true
elysper-tool-write.workspace = true
elysper-tool-shell.workspace = true
elysper-tool-todo.workspace = true

# The hot-path benchmarks: one binary that prints a table (`make
# bench`). `harness = false` keeps criterion (and its dependency tree)
# out of the workspace—the number that matters is the shape of the
# curve, and the fixtures are the only setup.
[[bench]]
name = "hot_paths"
harness = false
