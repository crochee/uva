[package]
name = "synthia-tool-task"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `task` tool plugin: multi-agent delegation by running registered peers as sub-agents (gates, worktree isolation, `@agent:` routing, subagent admission, batched completion notification)"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
synthia-core.workspace = true
synthia-provider.workspace = true
synthia-tool.workspace = true
synthia-harness.workspace = true
# R-OPT-1: typed-span (always-on) + OTel metrics for
# `record_subagent` (spawned / completed / failed /
# depth_exceeded). The crate takes a feature-less dep so
# the MVP minimal subset stays free of OTel; consumer
# enable via `synthia-telemetry/otlp` (the `synthia`
# facade's `telemetry` feature does that transitively).
synthia-telemetry = { workspace = true, default-features = false }
# R-OPT-1: needed at the `delegator.rs::current_trace_context_wire`
# call site to read `opentelemetry::Context::current()`. Same
# feature set as `synthia-telemetry/otlp` (already pulled by
# the line above), so this does not grow the dep tree.
opentelemetry = { workspace = true, features = ["trace"], optional = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
ulid.workspace = true
parking_lot.workspace = true
regex.workspace = true

[features]
# R-OPT-1: opt-in OTel metrics + trace-context propagation
# through delegation. Default off so the MVP subset stays
# OTel-free (`make check-mvp-deps`). The `synthia` facade's
# `telemetry` feature activates this transitively for
# synthia-server and other consumers.
otel = ["synthia-telemetry/otlp", "dep:opentelemetry"]

[dev-dependencies]
# The tests script `ModelProvider` impls and cancel through the same
# primitives the agent tests use; the lib itself names no runtime.
# `synthia-core`'s `tokio-util` feature supplies the
# `impl CancelToken for tokio_util::sync::CancellationToken` the tests
# pass to `Agent::run` — no longer provided by another crate's
# dependency list.
synthia-core = { workspace = true, features = ["tokio-util"] }
async-trait.workspace = true
tokio-util.workspace = true

# `#[tokio::test]` / `#[tokio::main]` (multi-thread flavor) — the only
# place this crate needs an executor. The gate and worktree code run
# `std::process::Command` on dedicated threads, and every other seam
# is `futures` + the caller's token (AGENTS.md §3.7).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
synthia-test-support.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
