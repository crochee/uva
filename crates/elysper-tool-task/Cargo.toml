[package]
name = "elysper-tool-task"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `task` tool plugin: multi-agent delegation by running registered peers as sub-agents (depth cap, verification gates, worktree isolation)"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
elysper-core.workspace = true
elysper-provider.workspace = true
elysper-tool.workspace = true
elysper-harness.workspace = true
# The `subagent-backend` plugin implements the kernel's `Plugin`
# contract. The kernel is dependency-free (`cordis` only), so the
# crate's lib tree stays runtime-free.
elysper-kernel.workspace = true
# Optional: read the ambient OTel span context in
# `runner.rs::parent_context_from_wire` when the `otel` feature is
# enabled. Off by default so the MVP subset stays OTel-free
# (`make check-mvp-deps`).
opentelemetry = { workspace = true, features = ["trace"], optional = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
# Opt-in OTel trace-context propagation through delegation. Default
# off so the MVP subset stays OTel-free (`make check-mvp-deps`).
otel = ["dep:opentelemetry"]

[dev-dependencies]
# The tests script `ModelProvider` impls and cancel through the same
# primitives the agent tests use; the lib itself names no runtime.
# `elysper-core`'s `tokio-util` feature supplies the
# `impl CancelToken for tokio_util::sync::CancellationToken` the tests
# pass to `Agent::run` — no longer provided by another crate's
# dependency list.
elysper-core = { workspace = true, features = ["tokio-util"] }
async-trait.workspace = true
tokio-util.workspace = true

# `#[tokio::test]` / `#[tokio::main]` (multi-thread flavor) — the only
# place this crate needs an executor. The gate and worktree code run
# `std::process::Command` on dedicated threads, and every other seam
# is `futures` + the caller's token (AGENTS.md §3.7).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
elysper-test-support.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
