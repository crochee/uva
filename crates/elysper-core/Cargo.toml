[package]
name = "elysper-core"
description = "Runtime-neutral foundation for elysper: Clock / IdGen / CancelToken / Spawner / Registry traits, error taxonomy, wire types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
chrono.workspace = true
base64.workspace = true
ulid.workspace = true
# `futures::executor::block_on` is the runtime-neutral inline
# executor for `spawn::InlineSpawner` — the runtime-free fallback
# the harness installs as its default when the consumer does not
# provide one. `futures::channel::oneshot` carries the wakeup back
# from `sleeper::ThreadSleeper`'s waiting thread and the completion
# back from `blocking::ThreadBlocking`'s working thread, and
# `futures::future::BoxFuture` is the `Sleeper` / `Blocking` traits'
# return type. `futures` is a primitives library, not a runtime:
# it has no reactor, no worker pool, and no I/O integration;
# the only "executor" surface it ships is the `block_on` we use
# here, which polls a future on the calling thread.
futures.workspace = true

# Both optional: this crate is the runtime-neutral foundation, so it
# must not force an HTTP client or an async runtime on a consumer.
#
# - `reqwest` exists for exactly one impl (`From<reqwest::Error> for
#   Error`, in `error.rs`) — the seam that lets an HTTP-speaking crate
#   `?` a transport error. Only `elysper-provider` turns it on.
# - `tokio-util` is the `CancellationToken` bridge in `cancel.rs`,
#   used by tokio-based callers that already hold one.
reqwest = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[features]
tokio-util = ["dep:tokio-util"]
reqwest = ["dep:reqwest"]

[dev-dependencies]
# Tests need *an* executor; `cargo test -p elysper-core` is the only
# place the crate's own tree sees tokio. `macros` = `#[tokio::test]`,
# `rt` = `tokio::spawn`, `time` = the cancellation test's sleep.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# The layout tests need a throwaway directory tree; nothing else in
# the crate touches the filesystem.
tempfile.workspace = true
