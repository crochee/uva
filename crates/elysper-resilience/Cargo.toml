[package]
name = "elysper-resilience"
description = "Circuit breaker + adaptive backoff + jitter per provider or tool: a single seam that wraps ModelProvider / Tool with classify → retry → breaker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
elysper-core.workspace = true
elysper-provider = { workspace = true, default-features = false }
elysper-tool.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Test-only: the crate itself names no runtime. The retry backoff
# waits through `elysper_core::sleeper::Sleeper` (a std thread by
# default), so the tests need a runtime for `#[tokio::test]` and
# nothing else — no `time` (the crate arms no timer) and no
# `rt-multi-thread` (nothing asks for a multi-threaded runtime).
tokio = { workspace = true, features = ["macros", "rt"] }
chrono.workspace = true
tempfile.workspace = true