[package]
name = "uva-policy-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The shipped policy plugins: semantic cache, resilience and budget — one module and one feature per policy."
homepage.workspace = true
documentation.workspace = true

[features]
default = []
# One feature per policy. A feature turns on exactly that policy's
# module and the dependencies only that policy needs.
cache = ["dep:uva-search"]
resilience = ["dep:uva-tool"]
budget = ["dep:uva-tool"]

[dependencies]
uva-core.workspace = true
uva-provider = { workspace = true, default-features = false }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
parking_lot.workspace = true
chrono.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
# --- per-policy, optional ---
uva-tool = { workspace = true, optional = true }
uva-search = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
uva-core = { workspace = true, features = ["tokio-util"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true
uva-test-support.workspace = true
uva-tool.workspace = true
chrono.workspace = true

# An example needs its policy's feature: the family ships nothing
# until a feature asks for it.
[[example]]
name = "semantic_cache_demo"
required-features = ["cache"]
[[example]]
name = "resilience_demo"
required-features = ["resilience"]
[[example]]
name = "budget_demo"
required-features = ["budget"]
