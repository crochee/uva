[package]
name = "elysper-server"
description = "Reference HTTP / SSE / WebSocket server for elysper: axum router, config loader, agent / tool / skill / memory surfaces, OTel + Prometheus observability"
# Application crate, not a library: it is the wiring showcase, and the
# 40k lines behind it are not a crates.io contract. `elysper` (the
# facade) stays publishable — it is the documented consumer entry point.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# build.rs bakes the git SHA / build time / target triple into
# `build_info.rs` via `cargo:rustc-env=`; see `build.rs` for the
# source-priority chain. Cargo re-runs it whenever any of the three
# env vars changes (`cargo:rerun-if-env-changed=...` in build.rs).
build = "build.rs"
[features]
# Only `test-utils` remains. Observability is not feature-gated on
# this crate: OTel OTLP tracing, Prometheus RED metrics, the
# `/metrics` endpoint, and the `track_metrics` middleware are all
# always-on *for the server*, which is why both telemetry features are
# named here explicitly — the server must not lose OTLP if the crate's
# default set ever changes. The fallback to console tracing when
# neither gRPC nor HTTP OTLP is configured lives inside
# `elysper_telemetry::init_tracing`.
#
# `test-utils` forwards to the facade's `test-support` feature so
# `elysper::test_support::FakeProvider` is nameable from the
# for-test fixture. No direct `elysper-test-support` dependency:
# every call site goes through the facade (single-dependency rule).
test-utils = ["elysper/test-support"]
# Multi-node control plane: `[cluster] mode = "redis"` needs this
# feature (Redis pub/sub + SET NX EX leases). Off by default so the
# single-node build keeps zero Redis dependency.
cluster-redis = ["dep:redis"]

[dependencies]
# Optional Redis client, only pulled in by `cluster-redis`.
redis = { workspace = true, optional = true }
# Single-facade dependency rule (R121): the application crate talks to
# the AI agent SDK lib through `elysper` (the facade) only. The
# facade's feature set is the canonical "assemble the full server"
# set — every plugin tool, every model adapter, every optional
# integration (skill, attachment, MCP, telemetry) — and adding a new
# crate below the facade only requires a one-line feature change here.
# A library consumer that wants a smaller build drops the features at
# the `elysper` line; this crate has no reason to.
elysper = { workspace = true, features = [
  "core",
  "provider",
  "provider-anthropic",
  "provider-openai",
  "context",
  "tool",
  "tool-read",
  "tool-write",
  "tool-shell",
  "tool-todo",
  "tool-web",
  "tool-task",
  "tool-scheduler",
  "tool-search",
  "session",
  "steering",
  "harness",
  # The server is the repo's tokio host: it installs the runtime's
  # implementations of the `Sleeper` / `Spawner` seams (a retry
  # backoff costs a timer entry, not an OS thread).
  "harness-tokio",
  "skill",
  "attachment",
  "mcp",
  "plugin-host",
  "telemetry",
  "search",
  "scheduler",
  "eval",
  "workflow",
  "cron",
  "semantic-cache",
  "tool-memo",
  "resilience",
  "strategy-plan-execute",
  "strategy-cot",
  "strategy-best-of-n",
  "reflection",
  "budget",
] }
validator.workspace = true
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "fs"] }
# The one application crate: `rt-multi-thread` (worker pool), `macros`
# (`#[tokio::main]`, `select!`, tests), `net` (`TcpListener`),
# `signal` (Ctrl-C), `sync` (broadcast / mpsc / RwLock), `time` (SSE
# keepalive, deadlines), `io-util` (streamed bodies), `fs` (static
# assets, log files).
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
  "io-util",
  "fs",
] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures.workspace = true
async-stream.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
serde_yaml.workspace = true
dotenvy.workspace = true
clap.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
hex.workspace = true
base64.workspace = true
regex.workspace = true
schemars.workspace = true
prometheus.workspace = true
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
elysper.workspace = true
chrono.workspace = true
async-trait.workspace = true

[dev-dependencies.elysper-server]
path = "."
features = ["test-utils"]