[package]
name = "elysper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Facade for the elysper agent framework: one dependency, one prelude"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# The facade holds **no logic**—every module is a `pub use` of one
# underlying crate (`elysper::harness` = `elysper-harness`, …) and the
# `prelude` is a curated subset. Dependency direction is one-way:
# `elysper` → `elysper-*`, never back.
#
# Each piece is an *optional* dependency behind a same-named feature,
# so a consumer compiles exactly the lego they asked for. The default
# set is the "assemble a basic agent" set; everything else (skills,
# attachments, MCP, the scheduler, eval, workflows, telemetry,
# SQLite memory, the app crate, test support) is opt-in.
#
# `async-trait` is the one non-elysper dependency: the async traits the
# facade re-exports (`ModelProvider`, `Tool`, `Agent`, …) can only be
# implemented with that attribute macro, and a facade that makes you
# add a second dependency to implement its own traits has failed at
# its one job. It is re-exported as `elysper::async_trait`.
[dependencies]
elysper-core = { workspace = true, optional = true }
# The plugin kernel: manifests and `mount_all`. Opt-in until the harness
# moves onto it; the kernel carries `cordis-rs` and no runtime.
elysper-kernel = { workspace = true, optional = true }
elysper-provider = { workspace = true, optional = true }
elysper-context = { workspace = true, optional = true }
elysper-tool = { workspace = true, optional = true }
elysper-tool-read = { workspace = true, optional = true }
elysper-tool-write = { workspace = true, optional = true }
elysper-tool-shell = { workspace = true, optional = true }
elysper-tool-todo = { workspace = true, optional = true }
elysper-tool-web = { workspace = true, optional = true }
elysper-tool-task = { workspace = true, optional = true }
elysper-tool-scheduler = { workspace = true, optional = true }
elysper-tool-search = { workspace = true, optional = true }
elysper-session = { workspace = true, optional = true }
elysper-steering = { workspace = true, optional = true }
elysper-harness = { workspace = true, optional = true }
elysper-macros = { workspace = true, optional = true }
# The tokio implementations of the runtime-neutral seams
# (`TokioSpawner` / `TokioSleeper` / `TokioBlocking`), behind the
# opt-in `harness-tokio` feature. The feature adds no runtime to a
# consumer that opts in — it pulls `elysper-harness-tokio`, which
# depends on `tokio` with the `rt` + `time` features only. (The
# facade's *default* features are a different story: the two HTTP
# provider adapters carry tokio; see the `harness-tokio` feature note
# below.)
elysper-harness-tokio = { workspace = true, optional = true }

elysper-skill = { workspace = true, optional = true }
elysper-agents = { workspace = true, optional = true }
elysper-attachment = { workspace = true, optional = true }
elysper-mcp = { workspace = true, optional = true }
elysper-search = { workspace = true, optional = true }
elysper-scheduler = { workspace = true, optional = true }
elysper-eval = { workspace = true, optional = true }
elysper-workflow = { workspace = true, optional = true }
elysper-telemetry = { workspace = true, optional = true }
elysper-test-support = { workspace = true, optional = true }
elysper-semantic-cache = { workspace = true, optional = true }
elysper-tool-memo = { workspace = true, optional = true }
elysper-resilience = { workspace = true, optional = true }
elysper-strategy-plan-execute = { workspace = true, optional = true }
elysper-strategy-cot = { workspace = true, optional = true }
elysper-strategy-best-of-n = { workspace = true, optional = true }
elysper-reflection = { workspace = true, optional = true }
elysper-budget = { workspace = true, optional = true }
elysper-runtime = { workspace = true, optional = true }
# : opt-in plug-ins in the new round (Tier 1 perf + concurrency).
# Default-NO for every one so the seven-feature MVP subset stays at zero
# HTTP/OTel/DB dependencies (`make check-mvp-deps` is the assertion).
# W2: the dynamic plugin channel's wire crate. Opt-in and serde-only;
# it does not depend on the harness, so a plugin author can take it
# alone. `elysper-plugin-host` maps its vocabulary onto internal types.
elysper-plugin-protocol = { workspace = true, optional = true }
# W2: the host half of the same channel. It registers `Host` entries
# and speaks `Tool`, so its feature pulls those modules — unlike the
# wire crate, this one is not usable alone.
elysper-plugin-host = { workspace = true, optional = true }
# The opt-in Wasm component runtime. Default-NO: it carries `wasmtime`
# (a JIT plus Cranelift), the one dependency the default build must
# never resolve. `make check-wasm-deps` is the assertion.
elysper-wasm-runtime = { workspace = true, optional = true }

async-trait.workspace = true

[dev-dependencies]
# Examples and doc tests need *an* executor for `main`/`#[tokio::main]`;
# the framework's own seams never name a runtime.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
# Draining an `Agent` event stream is `StreamExt::next`—the same
# combinator a consumer already has through their own `futures` dep.
futures.workspace = true
# `Tool::parameters` is a `serde_json::Value`; the example's custom
# tool builds one, exactly as a consumer's would.
serde_json.workspace = true

# The example is the tutorial done end to end, so it needs the
# assembly set (the default features). Under a narrower selection cargo
# skips it instead of failing the build.
[[example]]
name = "assemble_from_zero"
required-features = [
  "core",
  "provider",
  "context",
  "tool",
  "tool-read",
  "tool-write",
  "tool-shell",
  "tool-todo",
  "session",
  "steering",
  "harness",
]

[[test]]
name = "tokio_adapters"
required-features = ["harness-tokio"]

[features]
# Assemble a basic agent: provider + tools + steering + context
# manager + session sink + cancel token + the agent loop + the
# `#[derive(Tool)]` macro.
#
# The default set is "everything a normal agent wants": the providers,
# every shipped tool plugin (the multi-agent `task` among them), and
# the `#[derive(Tool)]` macro. Each piece is its own feature precisely
# so a consumer can drop it—`default-features = false` plus the
# seven names in MINIMAL.md compiles no HTTP client and **zero** tool
# implementations.
default = [
  "core",
  "provider",
  "provider-anthropic",
  "provider-openai",
  "context",
  "tool",
  "tool-read",
  "tool-write",
  "tool-shell",
  "tool-todo",
  "tool-web",
  "tool-task",
  "session",
  "steering",
  "harness",
  "macros",
]

# --- the default set -------------------------------------------------
#
# Each feature pulls exactly the crate behind its module and the
# crates that module's types refer to, so enabling one module never
# leaves a type from a sibling module unnameable.
core = ["dep:elysper-core"]
# The `ModelProvider` trait, the wire types, the token estimator, the
# typed profiles. No HTTP client: see the two adapter features.
provider = ["dep:elysper-provider", "core"]
# The shipped adapters, each carrying `reqwest` and its transport
# stack. `AnthropicProvider` / `OpenAICompatibleProvider`.
provider-anthropic = ["provider", "elysper-provider/anthropic"]
provider-openai = ["provider", "elysper-provider/openai"]
context = ["dep:elysper-context", "core", "provider", "session"]
# The registry, the `Tool` trait, the exposure projection, the
# `workspace` path confinement. No tool implementations—those are
# the plugin features below.
tool = ["dep:elysper-tool", "core", "provider", "session"]
# One tool implementation per feature, exactly as a consumer would
# depend on them. All offline except `tool-web`.
tool-read = ["tool", "dep:elysper-tool-read"]
tool-write = ["tool", "dep:elysper-tool-write"]
tool-shell = ["tool", "dep:elysper-tool-shell"]
tool-todo = ["tool", "dep:elysper-tool-todo"]
# The one tool that talks to the network—the only one that pulls
# an HTTP client and its transport stack.
tool-web = ["tool", "dep:elysper-tool-web"]
# The multi-agent `task` tool: a synthetic tool that runs a
# registered peer as a child agent. Offline, but it pulls the agent
# crate (children run in-process, through the interceptor seam).
tool-task = [
  "dep:elysper-tool-task",
  "harness",
  "tool",
]
session = ["dep:elysper-session", "core", "provider"]
steering = ["dep:elysper-steering", "core", "context", "provider"]
harness = [
  "dep:elysper-harness",
  "core",
  "provider",
  "context",
  "session",
  "steering",
  "tool",
]
# `#[derive(Tool)]` and the other proc macros.
macros = ["dep:elysper-macros"]

# --- opt-in pieces ---------------------------------------------------
skill = ["dep:elysper-skill", "core", "tool"]
# The file-backed agent definitions (`agents/<name>/agent.md`).
agents = ["dep:elysper-agents", "core"]
attachment = ["dep:elysper-attachment", "core", "provider"]
mcp = ["dep:elysper-mcp", "core", "tool"]
# The `schedule` tool—the model-facing adapter over
# `elysper-scheduler`. It pulls the `scheduler` feature because the
# tool is constructed from a `ScheduleStore` and delivers through a
# `Scheduler`: without that feature the module would be unnameable.
# Opt-in rather than default, like `mcp`: both need a host-constructed
# runtime object (a supervisor, a store), not just a registration.
tool-scheduler = [
  "dep:elysper-tool-scheduler",
  "tool",
  "scheduler",
]
# The cross-domain `search` tool over a host-built `elysper-search`
# `Registry`. Opt-in like `mcp` / `tool-scheduler`: the host must first
# construct the Registry it searches, and it is that Registry—not
# this feature—that decides which domains exist.
tool-search = [
  "dep:elysper-tool-search",
  "tool",
  "search",
]
scheduler = ["dep:elysper-scheduler", "core"]
search = ["dep:elysper-search", "core"]
# The config-driven assembly layer: fat plugin factories for the
# built-in native plugins (model-adapter with the tier-1 wrapping
# chain, agent-loop, …). Opt-in and never in the default set: it
# carries the provider adapters and the tier-1 plugin crates, which
# the seven-feature MVP subset deliberately stays free of.
runtime = [
  "dep:elysper-runtime",
  "kernel",
  "provider",
  "harness",
  "tool",
  "session",
  "context",
  "semantic-cache",
  "resilience",
  "budget",
]
# The whole cron path, both halves at once: the parser behind
# `elysper::scheduler::CronTrigger` (`elysper-scheduler/cron`) *and*
# the `schedule` tool's acceptance of `kind: "cron"`
# (`elysper-tool-scheduler/cron`). A parser-only feature would be a
# half-cutover: `create` is refused by the tool layer unless *its*
# forwarding feature is on, so the round's user-visible win—the
# model can create cron jobs—would stay unreachable from the facade.
# Opt-in, and out of the default set, like the two features it builds
# on.
cron = [
  "scheduler",
  "elysper-scheduler/cron",
  "tool-scheduler",
  "elysper-tool-scheduler/cron",
]
eval = ["dep:elysper-eval", "core"]
workflow = ["dep:elysper-workflow", "core"]
telemetry = [
  "dep:elysper-telemetry",
  "core",
  "elysper-telemetry/metrics",
  "elysper-telemetry/otlp",
]
# Forwards to `elysper-context/sqlite` (bundled SQLite + FTS5 memory).
sqlite = ["context", "elysper-context/sqlite"]
# Deterministic fakes (`ReplayProvider`, …) for other crates' test
# suites; never enable this from a production binary.
test-support = ["dep:elysper-test-support", "core", "provider", "tool"]
# The HNSW vector-index backend (`elysper-search/hnsw`). Opt-in and
# not in the default set, so the MVP subset (`make check-mvp-deps`)
# keeps proving zero HTTP/OTel/DB deps for the seven-feature minimum.
hnsw = ["search", "elysper-search/hnsw"]

# AI Agent Plugin Optimization Roadmap: six
# opt-in surfaces (Tier 1 performance + concurrency, Tier 2
# reasoning + quality). Each is its own small dependency that
# joins the offline tier—`make check-mvp-deps` proves no
# HTTP/OTel/DB stack is dragged in. None is in the default set;
# deployments opt in per `[agents.<name>]` config.
semantic-cache = ["dep:elysper-semantic-cache", "core", "provider"]
tool-memo = ["dep:elysper-tool-memo", "core", "tool"]
resilience = ["dep:elysper-resilience", "core", "provider", "tool"]
strategy-plan-execute = [
  "dep:elysper-strategy-plan-execute",
  "harness",
  "core",
  "provider",
  "tool",
  "steering",
]
# The chain-of-thought strategy plugin. Default-NO (like
# strategy-plan-execute): the harness itself ships only the
# canonical ReAct loop; deployments that want CoT opt in.
strategy-cot = [
  "dep:elysper-strategy-cot",
  "harness",
  "core",
  "provider",
]
# The best-of-N strategy plugin. Default-NO, same reasoning.
strategy-best-of-n = [
  "dep:elysper-strategy-best-of-n",
  "harness",
  "core",
  "provider",
]
reflection = [
  "dep:elysper-reflection",
  "core",
  "provider",
  "tool",
  "steering",
  "context",
]
budget = ["dep:elysper-budget", "core", "provider", "tool"]
# : four facade plug-ins that each gate a single
# performance/concurrency upgrade. Behaviour-neutral by default
# (NOT in the default set); enabling a feature installs the
# matching opt-in module under `elysper::hpc_*` and forwards the
# crate-level feature of the same name. See
# `docs/research/r-opt-hpc-round.md` for the per-feature
# contract. All four stay runtime-neutral (no tokio::* /
# async_std::* / smol::* in the public API; `make
# check-public-api-runtime` is the gate).
hpc-pool = ["provider", "elysper-provider/hpc-pool"]
hpc-simd = ["search", "elysper-search/simd"]

# W2: the dynamic plugin channel. A single-crate axis, not a bundle:
# the wire vocabulary is useful on its own (a plugin author reads it
# without the harness), so it pulls no sibling feature.
plugin-protocol = ["dep:elysper-plugin-protocol"]

# W2: the host half. The crate's public types name `Host` and
# `PluginHandle` (harness), `Tool` and `Risk` (tool), the wire's
# `PluginCapabilities` (plugin-protocol), and the `Blocking` /
# `Sleeper` seams the builders take (core) — so the feature pulls each
# of those modules, the same way `budget` and `reflection` do.
plugin-host = [
  "dep:elysper-plugin-host",
  "plugin-protocol",
  "harness",
  "tool",
  "core",
]

# The plugin kernel (`Plugin`, `PluginManifest`, `mount_all`). A
# single-crate axis like `plugin-protocol`: the kernel names no harness,
# tool, or runtime type, so it pulls no sibling feature. Opt-in because
# nothing in the default assembly consumes it yet.
kernel = ["dep:elysper-kernel"]

# The Wasm component runtime: `WasmRuntime`, `WasmToolPlugin`, and
# `WasmSandbox`. Its public types name the kernel (`Plugin`,
# `PluginManifest`), the registry (`Tool`, `ToolRegistry`), and the
# shell's `SandboxBackend`, so the feature pulls those three modules.
# Default-NO, and the only feature that reaches `wasmtime`.
wasm = [
  "dep:elysper-wasm-runtime",
  "kernel",
  "tool",
  "tool-shell",
]

# The one runtime the facade speaks: `elysper-harness-tokio`'s three
# adapters, so a consumer on tokio reaches them through the single
# dependency (`elysper::harness_tokio::TokioSleeper`, …) instead of
# adding the sibling crate by hand. Opt-in like the adapters are.
#
# The feature adds **no** runtime to a consumer that opts in: it
# pulls `elysper-harness-tokio`, whose only runtime dependency is
# `tokio` with the `rt` + `time` features. Measured with
#   cargo tree -p elysper --no-default-features --features harness-tokio -e normal
# that is exactly one tokio package (`tokio`).
#
# The facade's DEFAULT features are a different story, and the
# difference must not be papered over: they include
# `provider-anthropic` and `provider-openai`, whose HTTP adapters
# carry `reqwest` → `hyper-rustls` → `hyper` → `h2` → `tokio`.
# Measured with
#   cargo tree -p elysper -e normal
# the default tree holds four tokio packages (`tokio`,
# `tokio-macros`, `tokio-rustls`, `tokio-util`). A consumer that
# wants a runtime-free tree must say `default-features = false` — the
# seven-feature MVP subset (`core,provider,context,tool,session,
# steering,harness`) measures zero, which `make check-mvp-deps` keeps
# proving.
harness-tokio = ["dep:elysper-harness-tokio", "core"]
