[package]
name = "uva-context"
description = "Context window management for uva: truncating / noop / summarizing / DAG context managers and the memory tier (in-memory / file / SQLite)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
[dependencies]
uva-core.workspace = true
# The `memory` plugin: memory mounts on the kernel spine like every
# other capability. The direction stays context → kernel (the kernel
# never depends on context; `check-kernel-deps` asserts that side).
uva-kernel.workspace = true
# Context managers consume the provider wire types (`Message`,
# `ContentPart`, `ModelConfig`) and the cheap token estimator, so
# the dependency direction is context → provider (one-way).
uva-provider.workspace = true
async-trait.workspace = true
# The memory tier's conversation backend is the inert session
# sink; the dependency stays one-way (context → session; session
# is a leaf crate).
uva-session.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
# Wall-clock timestamps use chrono (workspace-wide time library);
# monotonic durations stay on `std::time::Instant`.
chrono.workspace = true
# Optional: the SQLite-backed memory tier (`memory::sqlite`, FTS5
# recall). Off by default so the default build stays C-dependency
# free.
rusqlite = { workspace = true, optional = true }

[features]
# Enable `memory::sqlite` (`SqliteMemory`). Pulls in bundled SQLite.
sqlite = ["dep:rusqlite"]
# R-OPT-HPC Step 5: opt-in `frozen_segments` /
# `prefetch_compaction` companion methods on
# [`ContextManager`]. The trait keeps a default
# implementation (`return &[]` / no-op) so default builds are
# byte-identical to the pre-R-OPT-HPC tree. See
# `docs/research/r-opt-hpc-round.md` for the contract.
prefetch = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# The file-backed memory tier's tests need hermetic temp roots.
tempfile.workspace = true

# The `sqlite` example only builds when the backend it documents is
# compiled in; `cargo test` (default features) skips it cleanly.
[[example]]
name = "sqlite_memory"
required-features = ["sqlite"]
