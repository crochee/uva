[package]
name = "elysper-plugin-host"
description = "Host half of Elysper's dynamic plugin channel: process management, a JSON-RPC client, and Host registrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# The host half of the dynamic plugin channel, and no runtime.
#
# The plugin is a `std::process::Command` and its blocking protocol IO
# runs through `elysper_core::blocking::Blocking` — `elysper-core` is
# here for that seam alone, not for a sleeper.
# The deadline is a condition variable in the connection's own reaper
# thread (`src/client.rs`): a `Sleeper` wait cannot be cancelled, so a
# reaper built on one would either spawn a sleeper thread per request
# or delay shutdown by a whole timeout. That is also why this crate
# cannot reuse `elysper-mcp`'s transport stack (tokio + reqwest) and
# owns the process itself instead. `cargo tree -p elysper-plugin-host
# -e normal | grep -c tokio` must print 0.
[dependencies]
elysper-plugin-protocol.workspace = true
elysper-harness.workspace = true
elysper-tool.workspace = true
# The `process-plugins` entry is a native kernel plugin: it speaks the
# kernel's manifest/effect contract, not a runtime's.
elysper-kernel.workspace = true
# A refused host bind is reported through the same logging facade the
# harness uses; this is not a runtime dependency.
tracing.workspace = true
elysper-core.workspace = true
elysper-steering.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The observer test points a plugin's event log at a temporary file.
tempfile.workspace = true
# The tool test reads the content parts out of a `ToolOutput`; those
# parts are the provider's vocabulary, not this crate's.
elysper-provider.workspace = true
# The audit test runs one real agent loop over a remote plugin: the
# rewrite of its tool result has to leave a row in the session log.
elysper-session.workspace = true
# The dispatch context a host registration receives carries the run's
# `AgentState`.
elysper-context.workspace = true
