[package]
name = "uva-tui"
description = "A ratatui terminal projection of the uva gateway"
# Application crate, not a library: it is a TUI binary that drives the
# `uva-app-server serve` gateway, so its surface is a deployment
# contract rather than a crates.io one. `cargo package` still works
# (the publishable gate packages it); `cargo publish` refuses it.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
# The transport contract: the shared gateway client (the same `/rpc`
# WebSocket the browser speaks) plus the `serve` process supervisor.
# `uva-gateway` is `publish = false`, which is why this crate is
# too — nothing here belongs on a registry.
uva-gateway.workspace = true
# The wire shapes the terminal decodes are the server's own types: the
# follow baseline arrives as `uva-app-server`'s `FollowSnapshot`, so
# the shape has one owner instead of two. The edge links **only** the
# wire types: measured on the built terminal (`nm -C`, debug build),
# the binary carries 1116 `uva_app_server` symbols and zero
# `axum::routing`, zero `reqwest::` and zero `AppState` ones — the
# server's runtime is not pulled in (the gateway does not link the
# server either; it supervises its `serve` binary as a child
# process). What the edge does cost is the wire types' own code: the
# release terminal grows 66,720 bytes (+2.2%) against the one that
# carried its own copies of the shapes (3,024,080 → 3,090,800 bytes,
# same tree, same dependency versions).
uva-app-server.workspace = true
clap.workspace = true
serde_json.workspace = true
# The `ui/schema` wire DTOs deserialize through serde's derive.
serde.workspace = true
# The event loop reads terminal events as a futures `Stream`
# (`crossterm::event::EventStream`), so the workspace's futures crate
# is enough; `event-stream` is the only crossterm feature this crate
# adds beyond the backend's defaults.
futures.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
ratatui.workspace = true
anyhow.workspace = true
# The binary crate's runtime: `rt-multi-thread` (the event loop and
# the driver task), `macros` (`#[tokio::main]`, `select!`, tests),
# `sync` (the event and notification channels), `time` (the render
# tick and the liveness probe cadence). Process spawning lives in the
# gateway crate now.
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
# The supervisor's synchronous slots (the client and follow record).
parking_lot.workspace = true
# `SendError` is the one error enum a caller matches; the binary keeps
# `anyhow` at its boundary.
thiserror.workspace = true
# The one local action (copy an id) reaches the terminal's clipboard
# through OSC 52, whose payload is base64.
base64.workspace = true
# The one-line truncation rule the transcript's tool lines use: the
# workspace's canonical character-boundary truncator. The `…` marker
# and the limit stay here, where the rendering lives.
uva-core.workspace = true
# The row vocabulary: the projection asks the session crate to restore
# a durable row into the current vocabulary (`restore_row`) and its
# accounting of the vocabulary is an exhaustive match over `RowTag` —
# so a tag the vocabulary gains does not compile until the transcript
# says what it does with it (`docs/adr/0006-row-vocabulary-owns-the-row.md`).
uva-provider.workspace = true
uva-session.workspace = true
# The approval vocabulary: the held call a suspension projects is the
# approval crate's own `ApprovalRequest`, so the terminal reads the
# server's type instead of transcribing the request's fields.
uva-approval.workspace = true

[dev-dependencies]
# The interrupt entries a baseline carries are the approval
# vocabulary's shape, and the risk one names is the tool vocabulary's:
# the fixtures build them as vocabulary, not as transcribed JSON.
uva-tool.workspace = true
# The tests run against an in-process WebSocket gateway, so they need
# the axum the gateway crate's own tests use; `net` covers the test
# server's listener, `sync` the notification broadcast.
axum = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "net",
  "sync",
  "time",
] }
# The vocabulary's own published schema is how the projection's test
# enumerates every tag — the test keeps no copy of the vocabulary.
schemars.workspace = true
