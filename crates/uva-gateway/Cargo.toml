[package]
name = "uva-gateway"
description = "Shared gateway support for uva hosts: process supervision plus the gateway's JSON-RPC client"
# Application support crate: it spawns the `uva-app-server` binary
# (whose CLI contract it consumes), and that crate is `publish = false`,
# so this one is too — nothing here belongs on a registry.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
# The gateway crate consumes the app server's CLI contract (`serve
# --bind --port …`), not its libraries: the supervisor spawns the
# binary and the client speaks the gateway's WebSocket. `uva-app-server`
# is `publish = false`, which is why this crate is too.
uva-app-server.workspace = true
serde_json.workspace = true
futures.workspace = true
thiserror.workspace = true
# The supervisor's synchronous slots (the current process, the
# one-shot states receiver) take guards without a poisoning path.
parking_lot.workspace = true
# The gateway speaks plain JSON per WebSocket message (the browser side
# does the same); the Content-Length framing is only between the gateway
# and the core. `handshake` is the only feature needed: the client dials
# with `client_async` over a plain `TcpStream`, so no TLS stack is pulled.
tokio-tungstenite = { workspace = true, default-features = false, features = ["handshake"] }
# `ws://` URLs are parsed once per connection attempt to get the host
# and the port the `TcpStream` dials.
url.workspace = true
# The supervisor's runtime: `rt-multi-thread` (the supervisor task),
# `macros` (`select!` in the process monitor), `process` (spawning the
# server), `io-util` (the readiness probe's read/write), `net` (the
# probe's `TcpStream` and the ephemeral port pick), `time` (the restart
# backoff), `sync` (the child's stdout lock).
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "net",
  "time",
  "sync",
] }

[dev-dependencies]
# The client's tests run against an in-process WebSocket server; the
# workspace's axum entry already carries the `ws` feature.
axum = { workspace = true }
# The tests drive the supervisor over injected fakes and the client over
# a real loopback socket, so they need the runtime pieces the library
# itself keeps internal: `net` (the test server's listener), plus the
# plan's baseline set (`macros`/`rt` for `#[tokio::test]`, `io-util`
# and `time` for the scripted probes).
tokio = { workspace = true, features = ["macros", "rt", "io-util", "time", "net"] }
