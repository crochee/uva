[package]
name = "uva-tool-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The shipped tool plugins: read, write, edit, shell, job, glob, grep, todo, web, scheduler, search and memo — one module and one feature per tool."
homepage.workspace = true
documentation.workspace = true

[features]
default = []
# One feature per tool. A feature turns on exactly that tool's module
# and the dependencies only that tool needs.
# The operator question: the tool holds a QuestionOwner seam the
# host installs; the module needs nothing beyond the tool trait.
ask = []
# The explore-then-cut-back pair: the tools hold a RewindStore seam
# the host installs; the module needs nothing beyond the tool trait.
checkpoint = []
# Cross-session messaging: the tool holds a SessionMessenger seam the
# host installs; the module needs nothing beyond the tool trait.
session-message = []
# and the dependencies only that tool needs.
read = []
write = []
edit = []
glob = []
goal = []
lsp = []
grep = ["dep:regex"]
shell = ["dep:libc"]
# The background runner enforces the shell crate's execution policy,
# so the job feature brings the shell module with it.
job = ["shell", "dep:libc", "dep:uva-core"]
todo = []
web = ["dep:reqwest", "dep:url", "dep:uva-core"]
scheduler = ["dep:uva-scheduler", "dep:uva-core"]
search = ["dep:uva-search"]
memo = ["dep:blake3", "dep:uva-core"]
cron = ["scheduler", "uva-scheduler/cron"]

[dependencies]
uva-kernel.workspace = true
uva-tool.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, features = ["preserve_order"] }
schemars_derive.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }
# --- per-tool, optional: a tool's dependency is opened by its feature ---
uva-core = { workspace = true, optional = true }
uva-scheduler = { workspace = true, optional = true }
uva-search = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
# --- shared by several tools ---
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
# `tokio-util`'s `CancellationToken` implements `uva_core::CancelToken`
# only when the core's `tokio-util` feature is on.
uva-core = { workspace = true, features = ["tokio-util"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile.workspace = true
uva-provider.workspace = true
uva-test-support.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true

# An example needs its tool's feature: the family ships nothing
# until a feature asks for it.
[[example]]
name = "read_ranges"
required-features = ["read"]
[[example]]
name = "write_modes"
required-features = ["write"]
[[example]]
name = "todo_list"
required-features = ["todo"]
[[example]]
name = "sandbox_policy"
required-features = ["shell"]
[[example]]
name = "allowlist"
required-features = ["web"]
[[example]]
name = "schedule_jobs"
required-features = ["scheduler"]
[[example]]
name = "search_tool_demo"
required-features = ["search"]
[[example]]
name = "tool_memo_demo"
required-features = ["memo"]

# A test target needs its plugin's feature: the family ships nothing
# until a feature asks for it.
[[test]]
name = "read-plugin"
required-features = ["read"]
[[test]]
name = "write-plugin"
required-features = ["write"]
[[test]]
name = "shell-plugin"
required-features = ["shell"]
[[test]]
name = "todo-plugin"
required-features = ["todo"]
[[test]]
name = "web-plugin"
required-features = ["web"]
[[test]]
name = "scheduler-plugin"
required-features = ["scheduler"]
[[test]]
name = "schedule_tool"
required-features = ["scheduler"]
[[test]]
name = "sandbox_smoke"
required-features = ["shell"]
