[package]
name = "elysper-tool-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The shipped tool plugins: read, write, shell, todo, web, task, scheduler, search and memo — one module and one feature per tool."
homepage.workspace = true
documentation.workspace = true

[features]
default = []
# One feature per tool. A feature turns on exactly that tool's module
# and the dependencies only that tool needs.
read = []
write = []
shell = ["dep:libc"]
todo = []
web = ["dep:reqwest", "dep:url", "dep:elysper-core"]
task = ["dep:elysper-harness", "dep:elysper-provider", "dep:elysper-core"]
scheduler = ["dep:elysper-scheduler", "dep:elysper-core"]
search = ["dep:elysper-search"]
memo = ["dep:blake3", "dep:elysper-core"]
# The `task` tool's tracing bridge and the scheduler's cron parser.
otel = ["dep:opentelemetry"]
cron = ["scheduler", "elysper-scheduler/cron"]

[dependencies]
elysper-kernel.workspace = true
elysper-tool.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, features = ["preserve_order"] }
schemars_derive.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "time",
] }
# --- per-tool, optional: a tool's dependency is opened by its feature ---
elysper-core = { workspace = true, optional = true }
elysper-provider = { workspace = true, optional = true }
elysper-harness = { workspace = true, optional = true }
elysper-scheduler = { workspace = true, optional = true }
elysper-search = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
opentelemetry = { workspace = true, features = ["trace"], optional = true }
# --- shared by several tools ---
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
# `tokio-util`'s `CancellationToken` implements `elysper_core::CancelToken`
# only when the core's `tokio-util` feature is on.
elysper-core = { workspace = true, features = ["tokio-util"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile.workspace = true
elysper-provider.workspace = true
elysper-test-support.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true

# An example needs its tool's feature: the family ships nothing
# until a feature asks for it.
[[example]]
name = "read_ranges"
required-features = ["read"]
[[example]]
name = "write_modes"
required-features = ["write"]
[[example]]
name = "todo_list"
required-features = ["todo"]
[[example]]
name = "sandbox_policy"
required-features = ["shell"]
[[example]]
name = "allowlist"
required-features = ["web"]
[[example]]
name = "delegation_gate"
required-features = ["task"]
[[example]]
name = "worktree_isolation"
required-features = ["task"]
[[example]]
name = "schedule_jobs"
required-features = ["scheduler"]
[[example]]
name = "search_tool_demo"
required-features = ["search"]
[[example]]
name = "tool_memo_demo"
required-features = ["memo"]
