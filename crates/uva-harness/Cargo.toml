[package]
name = "uva-harness"
description = "The runtime-neutral agent loop for uva: ReActAgent, the Host interception registry and the event stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
[dependencies]
async-trait.workspace = true
# No runtime bridge in the default build: the loop's public API only
# names `dyn CancelToken` / `Spawner`. Tests (and only tests) drive a
# `tokio_util::CancellationToken` through the trait, so that feature is
# declared in `[dev-dependencies]`.
uva-core.workspace = true
# The `agentLoop` plugin implements the kernel's `Plugin` contract. The
# kernel in turn depends only on the dependency-free `cordis` crate, so
# this does not pull a runtime into the harness.
uva-kernel.workspace = true
# The interception contract (the Hook/Gate/transformer traits, the
# twelve mount points, the decoupled HookContext and the registry) the
# seam layer dispatches through; the harness re-exports the trait and
# context names, so the frozen paths do not move (ADR 0004, ADR 0028).
uva-hook.workspace = true
uva-provider.workspace = true
uva-context.workspace = true
uva-steering.workspace = true
uva-session.workspace = true
uva-tool.workspace = true
# The approval vocabulary and decision functions live one crate below
# the harness; the crate root re-exports them so the frozen surface
# keeps its paths. `ApprovalGate` stays here until the interception
# contract moves under `uva-approval`.
uva-approval.workspace = true
# The run-event vocabulary lives one crate below the harness; the
# `events` module re-exports it so both the crate root and the deep
# path `uva_harness::events::…` keep their names.
uva-events.workspace = true
# The agent vocabulary — the `Agent` contract, `AgentInput`, the steer
# inboxes, the peer registry, the child-session writer source and the
# prompt manifest — lives one crate below the harness; the crate root
# and the `agent`/`input`/`prompt` modules re-export it, so the frozen
# surface keeps its paths.
uva-agent.workspace = true
# The loop names `SpanKind` in its tracing spans, and its tool
# dispatch feeds the Prometheus tool counters (`metrics`). The
# OTLP exporter stays off: the harness links no transport.
uva-telemetry = { workspace = true, default-features = false, features = [
  "metrics",
] }

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The loop fingerprints tool results and request envelopes (the
# guard's result digest, the prepare step's tool/policy hashes), so
# replay and drift checks compare digests, not payloads.
sha2.workspace = true
hex.workspace = true
# The harness is runtime-neutral: its `[dependencies]` carries zero
# tokio. A consumer on a tokio runtime depends on the sibling
# `uva-core-tokio` crate, which provides `TokioSpawner` —
# the adapter that bridges `Spawner` onto `tokio::spawn`. Consumers
# on `smol` / `async-std` / a bare `futures` executor install their
# own adapter and never enter that crate.
tracing.workspace = true
futures.workspace = true
parking_lot.workspace = true

[dev-dependencies]
# Examples use `#[tokio::main]` (multi-thread flavor by default);
# tests also use `tokio::sync::Mutex` and `tokio::time::sleep`.
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
# Tests drive `CancellationToken` through the `CancelToken` trait.
uva-core = { workspace = true, features = ["tokio-util"] }
# The benchmarks drive a turn on a pooled non-tokio executor, so the
# end-to-end number does not pay for a thread spawn per run.
futures = { workspace = true, features = ["thread-pool"] }
# Tests drive `CancellationToken` through the `CancelToken` trait.
tokio-util.workspace = true
uva-test-support.workspace = true
tracing-subscriber.workspace = true
# The assembly examples compose the plugin crates exactly as a
# downstream consumer would.
uva-tool-plugins = { workspace = true, features = [
  "read",
  "write",
  "shell",
  "todo",
] }

# The hot-path benchmarks: one binary that prints a table (`make
# bench`). `harness = false` keeps criterion (and its dependency tree)
# out of the workspace—the number that matters is the shape of the
# curve, and the fixtures are the only setup.
[[bench]]
name = "hot_paths"
harness = false
