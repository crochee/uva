[package]
name = "elysper-plugin-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The dynamic plugin channel: the wire protocol, the host that speaks it, and the Wasm component runtime."
homepage.workspace = true
documentation.workspace = true

[features]
default = ["protocol"]
# The wire contract: serde-only, so a plugin author in any language can
# read it without inheriting the harness, a runtime or a provider stack.
protocol = []
# The host half: turns a plugin *process* into registrations on the
# harness's `Host`.
host = [
  "protocol",
  "dep:elysper-harness",
  "dep:elysper-tool",
  "dep:elysper-kernel",
  "dep:elysper-core",
  "dep:elysper-steering",
]
# The Wasm component runtime. It reuses the shell plugin's sandbox seam
# to confine a component, so it is the one place where this crate
# depends on another family crate — an optional, one-way edge.
wasm = [
  "dep:wasmtime",
  "dep:sha2",
  "dep:elysper-kernel",
  "dep:elysper-tool",
  "dep:elysper-tool-plugins",
  "elysper-tool-plugins/shell",
]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
# --- per-half, optional ---
elysper-harness = { workspace = true, optional = true }
elysper-tool = { workspace = true, optional = true }
elysper-kernel = { workspace = true, optional = true }
elysper-core = { workspace = true, optional = true }
elysper-steering = { workspace = true, optional = true }
elysper-tool-plugins = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
wasmtime = { workspace = true, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
  "wat",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
elysper-provider.workspace = true
elysper-session.workspace = true
elysper-context.workspace = true

[[bench]]
name = "wasm_calls"
harness = false
