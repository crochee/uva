# dependabot.yml — Uva
#
# 跟踪三类生态系统的依赖更新：cargo (workspace.lock) / GitHub Actions /
# npm (`uva-web/package-lock.json`)。每个 ecosystem 单独 schedule + 单独
# reviewer 噪音低。
#
# 周期: 三类 ecosystem 同日同刻 —— 每 2 个月 1 号 09:00 UTC (奇数月:
# 1/3/5/7/9/11)。`interval: cron` + `cronjob` 是 GitHub 支持的写法:
# 具名 interval 只到 `monthly`, 而 `quarterly` / `semiannually` / `yearly`
# 仅 GitHub Enterprise Server ≥ 3.19 可用, 所以"每 2 个月"只能走 cron。
# 时区不写进 cronjob —— 由 `timezone` 参数指定 (默认已是 UTC)。

version: 2
updates:
  # 1) Cargo — workspace.lock。沿用主分支。
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
        # 每 2 个月 1 号 09:00 UTC (奇数月: 1/3/5/7/9/11) 拉一次。
        # `interval: cron` + `cronjob` 是 GitHub 支持的写法——具名 interval
        # 只到 `monthly`, 半年/一年仅 GHES 可用, 所以 2 个月必须走 cron。
        # 与 `security-audit` 的 03:00 同日, 早 6 小时, 合 PR 前先看公告。
        interval: "cron"
        cronjob: "0 9 1 */2 *"
      # Major 不上 while PR 上 —— semver-major 在 0.x 阶段会 bump MINOR,
      # 破坏性变更要人审。Minor / patch 自动开 PR。
      ignore:
        - dependency-name: "*"
          update-types: ["version-update:semver-major"]
      # PR 上限 = 10 是为了不让 review 队列过载; 真实更新量低于上限。
      open-pull-requests-limit: 10
      # Group 把同源依赖聚合到一个 PR, 减少 review 噪音:
      # "rustls" / "openssl" / "tokio" 各自一组.
      groups:
        rust-crypto:
          patterns:
            - "rustls*"
            - "openssl*"
            - "ring"
            - "aws-lc*"
        tokio:
          patterns:
            - "tokio*"
            - "tokio-*"
            - "tokio-util"
            - "tokio-stream"
        async:
          patterns:
            - "futures*"
            - "async-*"
            - "async-trait"
        reqwest:
          patterns:
            - "reqwest*"
        axum:
          patterns:
            - "axum*"
            - "tower*"
            - "hyper*"
        opentelemetry:
          patterns:
            - "opentelemetry*"
            - "tracing*"
            - "tracing-subscriber*"
        serde:
          patterns:
            - "serde*"
        chrono:
          patterns:
            - "chrono*"
      # 不动 workspace 的版本字符串(主 branch 的人审); dependabot 只升 lock.
      # (本仓依赖用 workspace 收口, 见 AGENTS.md §3.1; 这里不写
      # `versioning-strategy: increase` 是为了让 dependabot 只升 Cargo.lock)
      labels:
        - "dependencies"
        - "cargo"
      commit-message:
        prefix: "deps"
        include: "scope"

  # 2) GitHub Actions — actions/checkout / dtolnay/rust-toolchain /
  #    Swatinem/rust-cache 等。 patch 自动, minor/major 走人审。
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        # 与 cargo 同日同刻 —— 三个 ecosystem 一起跑, PR 队列不会错开。
        interval: "cron"
        cronjob: "0 9 1 */2 *"
      ignore:
        - dependency-name: "*"
          update-types: ["version-update:semver-major"]
      open-pull-requests-limit: 5
      groups:
        actions:
          patterns:
            - "actions/*"
            - "dtolnay/*"
            - "Swatinem/*"
            - "docker/*"
            - "taiki-e/*"
            - "github/*"
            # v0.1.0 hardening: ludeeus/* and sigstore/* were missing
            # from this group, so dependabot opened individual PRs
            # for them. Now they fold into the single bi-monthly PR.
            - "ludeeus/*"
            - "sigstore/*"
            - "dependabot/*"
      labels:
        - "dependencies"
        - "ci"

  # 3) npm — uva-web 单一 lock (R72 收口为一份, 见 AGENTS.md §4.2)。
    - package-ecosystem: "npm"
      directory: "/uva-web"
      schedule:
        # 与 cargo / github-actions 同日同刻。
        interval: "cron"
        cronjob: "0 9 1 */2 *"
      open-pull-requests-limit: 10
      groups:
        react:
          patterns:
            - "react*"
            - "@types/react*"
        build:
          patterns:
            - "vite*"
            - "@vitejs/*"
            - "typescript"
            - "eslint*"
            - "prettier"
        msw:
          patterns:
            - "msw"
      labels:
        - "dependencies"
        - "web"