# markdown-lint.yml — Uva
#
# 与 .markdownlint.json 配对使用（单一真源）：
#   - 锁每个 crate 顶层 README.md 的 markdown 格式；
#   - 与 .editorconfig 的 trim_trailing_whitespace / LF 配合；与 prettier
#     互不重叠（prettier 只跑前端，markdown-lint 跑所有 markdown）；
#   - 与 `make fmt-check` / `make check-web` 互不重叠（rustfmt + 前端
#     prettier）；组成 "rustfmt + prettier + markdownlint" 三件套。
#
# scope 决定：显式列举 25 个 crate README + 顶层 CONTRIBUTORS.md（不是
# glob 排除模式）— 这样新加一个目录不会"无意中"进入 lint 范围，而是
# 显式决策后才加。这是 rust-lang/tokio 的同一做法。
#
# 触发: push / PR / 每周二 UTC 04:00（与 stale-bot 错开一天）。
name: markdown-lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: markdownlint (.markdownlint.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run markdownlint-cli (explicit per-crate README + CONTRIBUTORS)
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: .markdownlint.json
          globs: |
            CONTRIBUTORS.md
            crates/uva/README.md
            crates/uva-runtime/README.md
            crates/uva-core/README.md
            crates/uva-provider/README.md
            crates/uva-context/README.md
            crates/uva-session/README.md
            crates/uva-kernel/README.md
            crates/uva-tool/README.md
            crates/uva-tool-plugins/README.md
            crates/uva-policy-plugins/README.md
            crates/uva-harness/README.md
            crates/uva-telemetry/README.md
            crates/uva-attachment/README.md
            crates/uva-mcp/README.md
            crates/uva-scheduler/README.md
            crates/uva-eval/README.md
            crates/uva-search/README.md
            crates/uva-skill/README.md
            crates/uva-steering/README.md
            crates/uva-test-support/README.md
            crates/uva-app-server/README.md
            crates/uva-tui/README.md
            crates/uva-core-tokio/README.md
            crates/uva-mcp-server/README.md
            crates/uva-gateway/README.md
