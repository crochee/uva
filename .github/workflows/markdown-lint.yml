# markdown-lint.yml — Elysper
#
# 与 .markdownlint.json 配对使用（单一真源）：
#   - 锁每个 crate 顶层 README.md 的 markdown 格式；
#   - 与 .editorconfig 的 trim_trailing_whitespace / LF 配合；与 prettier
#     互不重叠（prettier 只跑前端，markdown-lint 跑所有 markdown）；
#   - 与 `make fmt-check` / `make check-web` 互不重叠（rustfmt + 前端
#     prettier）；组成 "rustfmt + prettier + markdownlint" 三件套。
#
# scope 决定：显式列举 43 个 crate README + 顶层 CONTRIBUTORS.md（不是
# glob 排除模式）— 这样新加一个目录不会"无意中"进入 lint 范围，而是
# 显式决策后才加。这是 rust-lang/tokio 的同一做法。
#
# 触发: push / PR / 每天 UTC 04:00（与 stale-bot 错开 2 小时）。
name: markdown-lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: markdownlint (.markdownlint.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run markdownlint-cli (explicit per-crate README + CONTRIBUTORS)
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: .markdownlint.json
          globs: |
            CONTRIBUTORS.md
            crates/elysper/README.md
            crates/elysper-runtime/README.md
            crates/elysper-core/README.md
            crates/elysper-provider/README.md
            crates/elysper-context/README.md
            crates/elysper-session/README.md
            crates/elysper-kernel/README.md
            crates/elysper-tool/README.md
            crates/elysper-tool-plugins/README.md
            crates/elysper-policy-plugins/README.md
            crates/elysper-plugin-runtime/README.md
            crates/elysper-harness/README.md
            crates/elysper-telemetry/README.md
            crates/elysper-attachment/README.md
            crates/elysper-mcp/README.md
            crates/elysper-scheduler/README.md
            crates/elysper-workflow/README.md
            crates/elysper-eval/README.md
            crates/elysper-search/README.md
            crates/elysper-skill/README.md
            crates/elysper-steering/README.md
            crates/elysper-test-support/README.md
            crates/elysper-app-server/README.md
            crates/elysper-tui/README.md
            crates/elysper-agents/README.md
            crates/elysper-harness-tokio/README.md
            crates/elysper-macros/README.md
            crates/elysper-mcp-server/README.md
            crates/elysper-gateway/README.md
